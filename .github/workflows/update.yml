name: Weekly Fundamentals Update

on:
  schedule:
    - cron: "0 23 * * 0" # Every Sunday at 23:00 UTC
  workflow_dispatch:     # Lets you trigger a run manually anytime

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install requests

      - name: Fetch SEC & NASDAQ fundamentals
        run: python fetch_fundamentals.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamentals_import.csv
          git diff --staged --quiet || git commit -m "Update fundamentals CSV ($(date -u +'%Y-%m-%d'))"
          git push
